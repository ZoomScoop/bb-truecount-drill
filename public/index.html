<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Card Collection OS</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <h1>Card Collection OS</h1>
    <nav>
      <button id="nav-identify" class="active">Identify</button>
      <button id="nav-portfolio">Portfolio</button>
    </nav>
  </header>

  <main>
    <section id="view-identify" class="view active">
      <div class="card-box">
        <label>Photo of card</label>
        <input type="file" id="photo-input" accept="image/*" capture="environment" />
        <p class="muted" id="identify-status"></p>
      </div>

      <div id="result-box" class="card-box" style="display:none;">
        <img id="result-thumb" class="thumb" />

        <label>Category</label>
        <select id="f-category">
          <option value="pokemon">Pokemon</option>
          <option value="nhl">NHL</option>
          <option value="other">Other</option>
        </select>

        <label>Name</label>
        <input id="f-name" />

        <div class="row">
          <div><label>Set</label><input id="f-set" /></div>
          <div><label>Year</label><input id="f-year" /></div>
        </div>
        <div class="row">
          <div><label>Card #</label><input id="f-number" /></div>
          <div><label>Variant</label><input id="f-variant" /></div>
        </div>

        <label>Condition notes</label>
        <textarea id="f-condition" rows="2"></textarea>
        <p class="muted" id="confidence-note"></p>

        <div class="card-box">
          <strong>Check real prices</strong>
          <div id="price-links"></div>
        </div>

        <div class="row">
          <div><label>Acquisition cost ($)</label><input id="f-cost" type="number" step="0.01" /></div>
          <div><label>Observed market price ($)</label><input id="f-market" type="number" step="0.01" /></div>
        </div>
        <div class="row">
          <div><label>Platform fee %</label><input id="f-fee" type="number" step="0.1" value="13" /></div>
          <div><label>Est. shipping ($)</label><input id="f-shipping" type="number" step="0.01" value="0" /></div>
        </div>
        <label>Collectr app value ($) <span class="muted">(check the Collectr app, enter what it shows)</span></label>
        <input id="f-collectr" type="number" step="0.01" />

        <div class="card-box" id="profit-box">
          <strong>Expected profit</strong>
          <div id="profit-output" class="muted">Enter a cost and market price above.</div>
        </div>

        <label>Notes</label>
        <textarea id="f-notes" rows="2"></textarea>

        <button class="btn primary" id="save-card" style="margin-top:0.75rem;">Add to Collection</button>
        <p class="error" id="save-error"></p>
      </div>
    </section>

    <section id="view-portfolio" class="view">
      <div class="totals card-box">
        <div class="stat"><div class="muted">Total spent</div><div class="num" id="t-spent">$0</div></div>
        <div class="stat"><div class="muted">Est. value (held)</div><div class="num" id="t-value">$0</div></div>
        <div class="stat"><div class="muted">Unrealized gain</div><div class="num" id="t-unrealized">$0</div></div>
        <div class="stat"><div class="muted">Realized profit</div><div class="num" id="t-realized">$0</div></div>
      </div>
      <div id="portfolio-list"></div>
    </section>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
